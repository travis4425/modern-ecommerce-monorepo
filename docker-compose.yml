services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      # Sắp xếp tiếng Việt và unaccent cho full-text search ở Phase 4
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecom_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      # pgAdmin 8 trở lên bắt buộc mật khẩu tối thiểu 6 ký tự. Đặt 'admin' như
      # trước đây khiến container thoát ngay với mã 1 và rơi vào vòng restart.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      # Không có volume thì cấu hình server đã khai báo sẽ mất mỗi lần dựng lại
      # container, và pgAdmin cần thư mục này ghi được để khởi động.
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    name: ecom_postgres_data
  pgadmin_data:
    name: ecom_pgadmin_data
